<main class="shell">
  @switch (game.phase()) {
  @case ('home') { <impostor-home /> }
  @case ('lobby') { <impostor-lobby /> }
  @case ('round') { <impostor-round /> }
  @case ('voting') { <impostor-voting /> }
  @case ('reveal') { <impostor-reveal /> }
  @case ('waiting') { <impostor-waiting /> }
  }
</main>
@if (game.toast()) { <div class="toast" role="status">{{ game.toast() }}</div> }
@if (!game.connected()) { <div class="conn-overlay">
    <div class="big-emoji"><impostor-icon name="plug" /></div>
  <p>Reconectando…</p>
</div> }
