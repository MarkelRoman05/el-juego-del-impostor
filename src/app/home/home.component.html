<section class="view active home-view">
  <header class="hero">
    <div class="logo"><impostor-icon name="detective" /></div>
    <h1>El Impostor</h1>
  </header>
  <div class="card form-card">
    <label for="name">Nombre</label><input id="name" class="name-input" [(ngModel)]="name" maxlength="20"
      placeholder="Escribe un nombre..." autocomplete="off" (keydown.enter)="create()">
    <button class="btn primary big play-create-btn" (click)="create()"><impostor-icon name="game" /> Crear partida</button>
    <div class="divider"><span>o únete con un código</span></div>
    <div class="join-block">
      <label for="code" class="code-label">Código de sala</label>
      <div class="join-row">
        <div class="code-field">
          <div class="code-slots">
            @for (i of [0, 1, 2, 3]; track i) {
              <span class="code-slot" [class.code-slot--active]="codeFocused() && i === (code.length < 4 ? code.length : 3)">{{ code[i] || "" }}</span>
            }
          </div>
          <input #codeInput class="code-input" id="code" [ngModel]="code"
            (ngModelChange)="setCode($event)" maxlength="4"
            (focus)="codeFocused.set(true)" (blur)="codeFocused.set(false)"
            aria-label="Código de sala" autocomplete="off" (keydown.enter)="join()">
        </div>
        <button class="btn secondary" (click)="join()">Unirse</button>
      </div>
    </div>
  </div>
  <p class="hint footer-note">3+ jugadores · Sin registro</p>
  @if (showInstall()) {
    <button class="btn ghost small install-btn" (click)="install()"><impostor-icon name="download" />
      Instalar app en el navegador</button>
  }
  <p class="admin-link"><a href="#/admin/login">Admin</a></p>
</section>
