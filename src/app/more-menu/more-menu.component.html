@if (menu.player(); as player) {
<div class="more-backdrop" [class.show]="menu.open()" (click)="menu.close()">
  <div class="more-sheet" [class.show]="menu.open()" (click)="$event.stopPropagation()"
    (transitionend)="menu.closed()" role="menu" aria-modal="true" aria-label="Opciones de {{ player.name }}">
    <p class="more-title">{{ player.name }}</p>
    <button class="more-action" type="button" role="menuitem" (click)="makeHost()">
      <impostor-icon name="flag" /> Hacer host de la sala
    </button>
    <button class="more-action danger" type="button" role="menuitem" (click)="kick()">
      <impostor-icon name="cross" /> Expulsar de la sala
    </button>
    <button class="more-action cancel" type="button" role="menuitem" (click)="menu.close()">
      Cancelar
    </button>
  </div>
</div>
}
