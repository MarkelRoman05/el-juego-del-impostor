@if (game.reveal(); as reveal) {<section class="view active">
    <div class="players-bar">
        <p class="players-label">Jugadores ({{ game.room()?.players?.length }})</p>
        <div class="players"><span class="player-chip" [class.me]="player.id === game.me()"
                [class.off]="!player.connected" *ngFor="let player of game.room()?.players; trackBy: trackPlayer"><i
                    class="dot" [class.off]="!player.connected"></i>{{ player.name }} @if (player.id ===
                game.room()?.hostId) {<b class="badge">HOST</b>}</span></div>
    </div>
    <h2><impostor-icon name="detective" /> Fin de la partida</h2>
    <div class="reveal-impostor">
        <div class="impostor-emoji"><impostor-icon name="detective" /></div>
        <div class="who">{{ (reveal.impostors ?? []) | names }}</div>
        <div class="sub">era el impostor</div>
        <div class="word-box">
            <p class="eyebrow">LA PALABRA ERA</p>
            <div class="word">{{ reveal.word }}</div>
            <p class="category">Categoría: {{ reveal.category }}</p>
        </div>
    </div>
    <button class="btn primary big" [disabled]="!isHost()" (click)="game.nextRound()"><impostor-icon name="plus" />
        Nueva partida</button>
</section>}
